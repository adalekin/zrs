# Values without a default are required: `helm install` fails and names the missing one.
# The chart does not run PostgreSQL, the S3-compatible storage or the identity provider.

imagePullSecrets: []

settings:
  # OpenID Connect provider of the organization
  oidc:
    # Issuer URL, e.g. https://idp.example.com/realms/main
    issuer: ""
    # Client the web app signs people in with
    clientId: ""
    # Expected "aud" of the access token
    audience: ""
    # Where the provider lists roles: a top-level claim name or a dot-separated path
    rolesClaim: ""
  # The provider's value for each of the four roles
  roles:
    requester: ""
    moderator: ""
    financeDirector: ""
    payer: ""
  # ISO 4217 codes, e.g. [EUR, USD]
  currencies: []
  # Largest payment document, in bytes
  attachmentMaxBytes: ""
  # IANA time zone of the people who make the payments, e.g. Europe/Berlin
  timezone: ""
  # Time of day in that zone after which a payment is not made the same day, HH:MM in quotes, e.g. "16:30"
  paymentDayEndsAt: ""
  # Messages to people about requests: telegram or off
  notifications: ""
  # With notifications: telegram
  telegram:
    # Name of the bot without the at sign
    botUsername: ""
    # How the server reaches api.telegram.org: direct or proxy.
    # With proxy the address is the TELEGRAM_PROXY_URL key of the Secret: it may carry a password.
    egress: ""
    # Whether a request may be decided on from the chat with the bot, without signing in: "on" or "off", in quotes
    decisions: ""
  # Interface language: ru or en
  uiLocale: ""
  # Public URL of the web app, e.g. https://zrs.example.com
  publicUrl: ""
  storage:
    endpointUrl: ""
    bucket: ""
    region: ""
  database:
    host: ""
    port: 5432
    name: ""
    user: ""

# Secret settings. Either name an existing Secret holding the keys below, or put the values here
# and the chart creates the Secret.
#   DB_PASSWORD, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY, OIDC_CLIENT_SECRET, AUTH_SECRET
#   with notifications: telegram also TELEGRAM_BOT_TOKEN and, with egress: proxy, TELEGRAM_PROXY_URL
secrets:
  existingSecret: ""
  values:
    dbPassword: ""
    storageAccessKeyId: ""
    storageSecretAccessKey: ""
    oidcClientSecret: ""
    # Random string that encrypts the session cookie
    authSecret: ""
    # Token of the bot, with settings.notifications: telegram
    telegramBotToken: ""
    # Address of the proxy, e.g. socks5://user:password@proxy.internal:1080, with settings.telegram.egress: proxy
    telegramProxyUrl: ""

server:
  image:
    repository: ghcr.io/adalekin/zrs-server
    # Defaults to the chart's appVersion
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  podAnnotations: {}
  podLabels: {}
  resources: {}
  service:
    type: ClusterIP
    port: 80
    # Only for type NodePort
    nodePort: ""

web:
  image:
    repository: ghcr.io/adalekin/zrs-web
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  podAnnotations: {}
  podLabels: {}
  resources: {}
  service:
    type: ClusterIP
    port: 80
    nodePort: ""

# The Job that runs database migrations on every install and upgrade.
# Server pods report ready only after it has brought the schema up to their revision.
migrations:
  podAnnotations: {}
  podLabels: {}
  resources: {}
  # Seconds a finished Job is kept for its logs
  ttlSecondsAfterFinished: 86400

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls: []
