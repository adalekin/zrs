{{- $settings := .Values.settings -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zrs.fullname" . }}-web
  labels:
    {{- include "zrs.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "zrs.selectorLabels" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "zrs.selectorLabels" (dict "root" . "component" "web") | nindent 8 }}
        {{- with .Values.web.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.web.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "zrs.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: web
          image: {{ include "zrs.image" (dict "root" . "image" .Values.web.image) | quote }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: OIDC_ISSUER
              value: {{ required "settings.oidc.issuer is required" $settings.oidc.issuer | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ required "settings.oidc.clientId is required" $settings.oidc.clientId | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "zrs.secretName" . }}
                  key: OIDC_CLIENT_SECRET
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "zrs.secretName" . }}
                  key: AUTH_SECRET
            - name: AUTH_ORIGIN
              value: {{ required "settings.publicUrl is required" $settings.publicUrl | quote }}
            - name: API_URL
              value: {{ printf "http://%s-server:%v" (include "zrs.fullname" .) .Values.server.service.port | quote }}
            - name: UI_LOCALE
              value: {{ required "settings.uiLocale is required" $settings.uiLocale | quote }}
          {{- with .Values.web.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zrs.fullname" . }}-web
  labels:
    {{- include "zrs.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.web.service.type }}
  selector:
    {{- include "zrs.selectorLabels" (dict "root" . "component" "web") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
      {{- if and (eq .Values.web.service.type "NodePort") .Values.web.service.nodePort }}
      nodePort: {{ .Values.web.service.nodePort }}
      {{- end }}
