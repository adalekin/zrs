apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zrs.fullname" . }}-server
  labels:
    {{- include "zrs.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      {{- include "zrs.selectorLabels" (dict "root" . "component" "server") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "zrs.selectorLabels" (dict "root" . "component" "server") | nindent 8 }}
        {{- with .Values.server.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.server.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "zrs.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: server
          image: {{ include "zrs.image" (dict "root" . "image" .Values.server.image) | quote }}
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            {{- include "zrs.serverEnv" . | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
          # Ready only once the migrations Job has brought the schema up to this image's revision.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
          {{- with .Values.server.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zrs.fullname" . }}-server
  labels:
    {{- include "zrs.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: {{ .Values.server.service.type }}
  selector:
    {{- include "zrs.selectorLabels" (dict "root" . "component" "server") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.server.service.port }}
      targetPort: http
      {{- if and (eq .Values.server.service.type "NodePort") .Values.server.service.nodePort }}
      nodePort: {{ .Values.server.service.nodePort }}
      {{- end }}
