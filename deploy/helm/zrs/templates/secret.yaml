{{- if not .Values.secrets.existingSecret }}
{{- $values := .Values.secrets.values }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zrs.fullname" . }}
  labels:
    {{- include "zrs.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ required "secrets.values.dbPassword is required when secrets.existingSecret is not set" $values.dbPassword | quote }}
  S3_ACCESS_KEY_ID: {{ required "secrets.values.storageAccessKeyId is required when secrets.existingSecret is not set" $values.storageAccessKeyId | quote }}
  S3_SECRET_ACCESS_KEY: {{ required "secrets.values.storageSecretAccessKey is required when secrets.existingSecret is not set" $values.storageSecretAccessKey | quote }}
  OIDC_CLIENT_SECRET: {{ required "secrets.values.oidcClientSecret is required when secrets.existingSecret is not set" $values.oidcClientSecret | quote }}
  AUTH_SECRET: {{ required "secrets.values.authSecret is required when secrets.existingSecret is not set" $values.authSecret | quote }}
{{- end }}
