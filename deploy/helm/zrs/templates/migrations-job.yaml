apiVersion: batch/v1
kind: Job
metadata:
  # A Job cannot be changed in place, so every release revision gets its own.
  name: {{ include "zrs.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "zrs.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: {{ .Values.migrations.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "zrs.selectorLabels" (dict "root" . "component" "migrations") | nindent 8 }}
        {{- with .Values.migrations.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.migrations.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: OnFailure
      {{- include "zrs.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: migrate
          image: {{ include "zrs.image" (dict "root" . "image" .Values.server.image) | quote }}
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          env:
            {{- include "zrs.serverEnv" . | nindent 12 }}
          {{- with .Values.migrations.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
