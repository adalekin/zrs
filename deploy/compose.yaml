# Production example: the published images and PostgreSQL.
#
# The identity provider and the S3-compatible storage are yours: give their addresses below.
# Every variable is required; `docker compose -f deploy/compose.yaml config` names the ones that are missing.
# README.md describes each of them.
#
#   ZRS_VERSION                release to run, e.g. 0.2.0
#   ZRS_PUBLIC_URL             public URL of the web app, e.g. https://zrs.example.com
#   ZRS_HTTP_PORT              host port the web app listens on (put your TLS proxy in front of it)
#   UI_LOCALE                  ru or en
#   OIDC_ISSUER, OIDC_CLIENT_ID, OIDC_CLIENT_SECRET, OIDC_AUDIENCE, OIDC_ROLES_CLAIM
#   ROLE_REQUESTER, ROLE_MODERATOR, ROLE_FINANCE_DIRECTOR, ROLE_PAYER
#   CURRENCIES, ATTACHMENT_MAX_BYTES
#   S3_ENDPOINT_URL, S3_BUCKET, S3_REGION, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY
#   DB_PASSWORD, AUTH_SECRET
name: zrs

x-server-environment: &server-environment
  OIDC_ISSUER: ${OIDC_ISSUER:?set OIDC_ISSUER}
  OIDC_AUDIENCE: ${OIDC_AUDIENCE:?set OIDC_AUDIENCE}
  OIDC_ROLES_CLAIM: ${OIDC_ROLES_CLAIM:?set OIDC_ROLES_CLAIM}
  ROLE_REQUESTER: ${ROLE_REQUESTER:?set ROLE_REQUESTER}
  ROLE_MODERATOR: ${ROLE_MODERATOR:?set ROLE_MODERATOR}
  ROLE_FINANCE_DIRECTOR: ${ROLE_FINANCE_DIRECTOR:?set ROLE_FINANCE_DIRECTOR}
  ROLE_PAYER: ${ROLE_PAYER:?set ROLE_PAYER}
  CURRENCIES: ${CURRENCIES:?set CURRENCIES}
  ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:?set ATTACHMENT_MAX_BYTES}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?set S3_ENDPOINT_URL}
  S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
  S3_REGION: ${S3_REGION:?set S3_REGION}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: zrs
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
  DB_NAME: zrs

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: zrs
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: zrs
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zrs -d zrs"]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    image: ghcr.io/adalekin/zrs-server:${ZRS_VERSION:?set ZRS_VERSION}
    command: ["alembic", "upgrade", "head"]
    environment: *server-environment
    depends_on:
      postgres:
        condition: service_healthy

  server:
    image: ghcr.io/adalekin/zrs-server:${ZRS_VERSION:?set ZRS_VERSION}
    restart: unless-stopped
    environment: *server-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    image: ghcr.io/adalekin/zrs-web:${ZRS_VERSION:?set ZRS_VERSION}
    restart: unless-stopped
    environment:
      OIDC_ISSUER: ${OIDC_ISSUER:?set OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      AUTH_ORIGIN: ${ZRS_PUBLIC_URL:?set ZRS_PUBLIC_URL}
      API_URL: http://server:8000
      UI_LOCALE: ${UI_LOCALE:?set UI_LOCALE}
    ports:
      - "${ZRS_HTTP_PORT:?set ZRS_HTTP_PORT}:3000"
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres-data:
