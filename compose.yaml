# Development environment: `docker compose up --build` from the repository root starts the whole project.
#
#   web        http://localhost:3300
#   sign-in    alice (requester), bob (requester, moderator), carol (finance director),
#              dave and frank (payers), eve (no role); the password equals the user name
#
# Everything here is for development: fixed credentials, a test identity provider, data in local volumes.
# The production example lives in deploy/compose.yaml.
name: zrs

x-server-environment: &server-environment
  OIDC_ISSUER: http://keycloak.localhost:8085/realms/zrs
  OIDC_AUDIENCE: zrs
  OIDC_ROLES_CLAIM: resource_access.zrs-web.roles
  ROLE_REQUESTER: requester
  ROLE_MODERATOR: moderator
  ROLE_FINANCE_DIRECTOR: finance_director
  ROLE_PAYER: payer
  CURRENCIES: RUB,USD
  ATTACHMENT_MAX_BYTES: "10485760"
  TIMEZONE: Europe/Moscow
  PAYMENT_DAY_ENDS_AT: "16:30"
  # Notifications are off in development. To try them, make a bot of your own and start the stack with
  # NOTIFICATIONS=telegram, TELEGRAM_BOT_TOKEN, TELEGRAM_BOT_USERNAME and TELEGRAM_EGRESS in the environment.
  NOTIFICATIONS: ${NOTIFICATIONS:-off}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
  TELEGRAM_EGRESS: ${TELEGRAM_EGRESS:-}
  TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-}
  AUTH_ORIGIN: http://localhost:3300
  UI_LOCALE: ru
  S3_ENDPOINT_URL: http://storage:8333
  S3_BUCKET: zrs
  S3_ACCESS_KEY_ID: zrs-dev
  S3_SECRET_ACCESS_KEY: zrs-dev-secret
  S3_REGION: us-east-1
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: zrs
  DB_PASSWORD: zrs
  DB_NAME: zrs

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: zrs
      POSTGRES_PASSWORD: zrs
      POSTGRES_DB: zrs
    ports:
      # Loopback only, and not 5432: the server tests run on the host against the zrs_test database.
      - "127.0.0.1:54320:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./dev/postgres/create-test-database.sql:/docker-entrypoint-initdb.d/create-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zrs -d zrs"]
      interval: 2s
      timeout: 2s
      retries: 30

  storage:
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-dir=/data", "-ip.bind=0.0.0.0", "-s3", "-s3.config=/etc/seaweedfs/s3.json"]
    volumes:
      - storage-data:/data
      - ./dev/storage/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8333/healthz"]
      interval: 2s
      timeout: 2s
      retries: 60

  storage-init:
    build:
      context: ./server
      dockerfile: docker/Dockerfile
    command: ["python", "/dev-tools/create_bucket.py"]
    environment: *server-environment
    volumes:
      - ./dev/storage/create_bucket.py:/dev-tools/create_bucket.py:ro
    depends_on:
      storage:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    command: ["start-dev", "--import-realm", "--http-port=8085"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8085:8085"
    volumes:
      - ./dev/keycloak/zrs-realm.json:/opt/keycloak/data/import/zrs-realm.json:ro
    networks:
      default:
        aliases:
          # The same name and port reach the provider from the browser (every *.localhost name
          # resolves to the loopback address there) and from the other containers.
          - keycloak.localhost
    healthcheck:
      test:
        - CMD-SHELL
        # The image has no curl or wget: ask the management port over a bash TCP socket.
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 60

  migrate:
    build:
      context: ./server
      dockerfile: docker/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment: *server-environment
    depends_on:
      postgres:
        condition: service_healthy

  server:
    build:
      context: ./server
      dockerfile: docker/Dockerfile
    environment: *server-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 3s
      timeout: 3s
      retries: 30

  web:
    build:
      context: ./web
    environment:
      OIDC_ISSUER: http://keycloak.localhost:8085/realms/zrs
      OIDC_CLIENT_ID: zrs-web
      OIDC_CLIENT_SECRET: zrs-web-secret
      AUTH_SECRET: development-only-secret-change-me
      AUTH_ORIGIN: http://localhost:3300
      API_URL: http://server:8000
      UI_LOCALE: ru
    ports:
      - "127.0.0.1:3300:3000"
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres-data:
  storage-data:
