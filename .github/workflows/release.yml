name: Release

# A git tag vX.Y.Z publishes both images and the chart under the same version X.Y.Z.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the version and the registry namespace
        id: release
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "namespace=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the server image
        uses: docker/build-push-action@v7
        with:
          context: server
          file: server/docker/Dockerfile
          push: true
          tags: ${{ steps.release.outputs.namespace }}/zrs-server:${{ steps.release.outputs.version }}

      - name: Publish the web image
        uses: docker/build-push-action@v7
        with:
          context: web
          push: true
          tags: ${{ steps.release.outputs.namespace }}/zrs-web:${{ steps.release.outputs.version }}

      - uses: azure/setup-helm@v5

      - name: Publish the chart
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm package deploy/helm/zrs \
            --version "${{ steps.release.outputs.version }}" \
            --app-version "${{ steps.release.outputs.version }}"
          helm push "zrs-${{ steps.release.outputs.version }}.tgz" "oci://${{ steps.release.outputs.namespace }}/charts"
