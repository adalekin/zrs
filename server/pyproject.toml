[project]
name = "zrs-server"
version = "0.1.0"
description = "ZRS server: expense requests API"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "approck-fastapi-utils>=0.2.1",
    "approck-services[fastapi,sqlalchemy,upload]>=1.1.0",
    "approck-sqlalchemy-utils[postgres]>=0.2.2",
    "asyncpg>=0.31.0",
    "fastapi>=0.142.2",
    "httpx[socks]>=0.28.1",
    "loguru>=0.7.3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-httpx>=0.36.2",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole run: the application's database engine is a process-wide
# object and its connections belong to the loop that opened them.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]

[tool.ruff.lint.flake8-bugbear]
# FastAPI reads dependencies and parameters from argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
